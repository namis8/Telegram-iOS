workflows:
  telegram-ios-build:
    name: Build Telegram 11.8.1 Unsigned
    instance_type: mac_mini_m2
    environment:
      groups:
        - telegram
      xcode: latest
    scripts:
      - name: Fetch Submodules and Generate Project
        script: |
          set -e
          echo "Updating git submodules..."
          git submodule update --init --recursive
          
          echo "Generating Xcode project via Bazel..."
          python3 build-system/Make/Make --cacheDir="$HOME/telegram-cache" generateProject
          
          echo "Building Telegram (Unsigned)..."
          xcodebuild build \
            -workspace Telegram-iOS.xcworkspace \
            -scheme Telegram \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
            
          echo "Packaging into IPA..."
          mkdir -p Payload
          mv build/Release-iphoneos/Telegram.app Payload/
          zip -qr Telegram_Unsigned_11.8.1.ipa Payload
    artifacts:
      - Telegram_Unsigned_11.8.1.ipa
