workflows:
  telegram-ios-build:
    name: Build Telegram 11.8.1 Unsigned
    instance_type: mac_mini_m2
    environment:
      groups:
        - telegram
      xcode: 16.2
    scripts:
      - name: Generate Project and Build
        script: |
          set -e
          git submodule update --init --recursive
          
          # حقن الكود لحل مشكلة قراءة المتغيرات المنطقية (True/False) في Objective-C
          echo "#define True 1" > temp.m
          echo "#define False 0" >> temp.m
          cat submodules/BuildConfig/Sources/BuildConfig.m >> temp.m
          mv temp.m submodules/BuildConfig/Sources/BuildConfig.m
          
          mkdir -p build-system/local-config
          cat << EOF > build-system/local-config/config.json
          {
            "bundle_id": "com.custom.telegram.ios",
            "api_id": $TELEGRAM_API_ID,
            "api_hash": "$TELEGRAM_API_HASH",
            "team_id": "XXXXXXXXXX",
            "app_center_id": "",
            "is_internal_build": true,
            "is_appstore_build": false,
            "appstore_id": 686449807,
            "app_specific_url_scheme": "telegram",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF
          
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-cache" \
            generateProject \
            --configurationPath=build-system/local-config/config.json \
            --xcodeManagedCodesigning \
            --disableProvisioningProfiles \
            --disableExtensions
            
          xcodebuild build \
            -project Telegram/Telegram.xcodeproj \
            -scheme Telegram \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_derived_data \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
            
          mkdir -p Payload
          cp -R build_derived_data/Build/Products/Release-iphoneos/Telegram.app Payload/
          zip -qr Telegram_Unsigned_11.8.1.ipa Payload
    artifacts:
      - Telegram_Unsigned_11.8.1.ipa
