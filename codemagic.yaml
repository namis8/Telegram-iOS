workflows:
  telegram-ios-build:
    name: Build Telegram 11.8.1 Unsigned
    instance_type: mac_mini_m2
    environment:
      groups:
        - telegram
      xcode: 16.2
    scripts:
      - name: Build Telegram via Make.py
        script: |
          set -e
          git submodule update --init --recursive
          
          mkdir -p build-system/local-config
          cat << EOF > build-system/local-config/config.json
          {
            "bundle_id": "com.custom.telegram.ios",
            "api_id": $TELEGRAM_API_ID,
            "api_hash": "$TELEGRAM_API_HASH",
            "team_id": "XXXXXXXXXX",
            "app_center_id": "",
            "is_internal_build": true,
            "is_appstore_build": false,
            "appstore_id": "",
            "app_specific_url_scheme": "telegram",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF
          
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-cache" \
            build \
            --configurationPath=build-system/local-config/config.json \
            --buildNumber=1000 \
            --configuration=release_arm64 \
            --xcodeManagedCodesigning
            
          mkdir -p build/artifacts
          find . -name "*.ipa" -exec cp {} build/artifacts/ \;
    artifacts:
      - build/artifacts/*.ipa
